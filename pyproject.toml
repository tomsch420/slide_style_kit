[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slide_style_kit"
version = "0.1.0"
description = "Describe a lecture deck in the Uni Bremen look once, and render it to PowerPoint and PDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "krrood",
    "lxml",
    "Pillow",
    "pygments",
    "python-pptx",
    "reportlab",
    "svglib",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
# krrood already installs krrood-development-tools, which brings pytest.
dev = [
    "pre-commit",
]
# The computed examples of the lecture decks under decks/.
decks = [
    "contourpy",
    "matplotlib",
    "numpy",
    "rdflib",
    "scipy",
]

[project.scripts]
slide-style-kit-example = "slide_style_kit.example:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["slide_style_kit*"]

[tool.setuptools.package-data]
slide_style_kit = ["assets/*"]

[tool.krrood.check]
# The bundled example and the slide snippets are shown verbatim on slides; ORMatic
# generates the pose interface.
exclude = ['^src/slide_style_kit/assets/', '^decks/[^/]+/snippets/', '^decks/[^/]+/orm/pose_interface\.py$']

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
