# krrood's development tools, run from the `krrood` command this repository's development
# environment installs (`pip install -e ".[dev]"`); see krrood/doc/development_tools.md.
repos:
  - repo: https://github.com/cram2/cognitive_robot_abstract_machine
    rev: main
    hooks:
      - id: krrood-format
        exclude: ^src/slide_style_kit/assets/
      - id: krrood-check
        exclude: ^src/slide_style_kit/assets/
      - id: krrood-agents-md
